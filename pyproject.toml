[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casmi26-baseline"
version = "0.1.0"
description = "Offline mass-constrained spectral retrieval and optional fingerprint baseline"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy>=1.26,<2.3", "pandas>=2.1,<3", "pyarrow>=16,<24", "rdkit==2026.3.3", "PyYAML>=6,<7", "tqdm>=4.66,<5"]

[project.optional-dependencies]
fast = ["numba>=0.61,<0.64"]
train = ["torch>=2.3,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
casmi = "casmi_baseline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["casmi_baseline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
